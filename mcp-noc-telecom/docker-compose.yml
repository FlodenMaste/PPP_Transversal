# Socle de securite (cahier des charges A.6 / A.7) :
#   - Keycloak (OIDC) : emission et validation des jetons JWT du RBAC
#   - Le serveur MCP (serveur/) verifie ces jetons via JWKS (RS256)
# Lancer : docker compose up -d   (voir security/keycloak/README.md)

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: mcp-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-LabAdmin2026!}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      # Pas de KC_HOSTNAME fixe : issuer derive de l'hote reel (localhost:18080)
    ports:
      # 8080/9000 deja pris (assistit-caddy, minio) : on publie en 18080/19000
      - "18080:8080"
      - "19000:9000"
    volumes:
      - ./security/keycloak/realm-mcp.json:/opt/keycloak/data/import/realm-mcp.json:ro
