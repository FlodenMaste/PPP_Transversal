name: mcp-noc-lab

topology:
  nodes:
    r1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/r1/daemons:/etc/frr/daemons
        - configs/r1/frr.conf:/etc/frr/frr.conf
        - configs/r1/snmpd.conf:/etc/snmp/snmpd.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - apk add --no-cache net-snmp net-snmp-tools
        - snmpd

    r2:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/r2/daemons:/etc/frr/daemons
        - configs/r2/frr.conf:/etc/frr/frr.conf
        - configs/r2/snmpd.conf:/etc/snmp/snmpd.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - apk add --no-cache net-snmp net-snmp-tools
        - snmpd

    r3:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/r3/daemons:/etc/frr/daemons
        - configs/r3/frr.conf:/etc/frr/frr.conf
        - configs/r3/snmpd.conf:/etc/snmp/snmpd.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - apk add --no-cache net-snmp net-snmp-tools
        - snmpd

    client:
      kind: linux
      image: alpine:latest
      exec:
        - apk add --no-cache net-snmp-tools
        - ip addr add 192.168.1.10/24 dev eth1
        - ip route replace default via 192.168.1.1
      cmd: sleep infinity

    server:
      kind: linux
      image: alpine:latest
      exec:
        - apk add --no-cache net-snmp-tools
        - ip addr add 192.168.3.10/24 dev eth1
        - ip route replace default via 192.168.3.1
      cmd: sleep infinity

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r2:eth2", "r3:eth1"]
    - endpoints: ["r1:eth2", "r3:eth2"]
    - endpoints: ["r1:eth3", "client:eth1"]
    - endpoints: ["r3:eth3", "server:eth1"]
